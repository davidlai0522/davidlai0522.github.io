<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Lai | Robotics Research</title>
  <meta name="description" content="Personal portfolio of David Lai — PhD student and Robotics Research Engineer specialising in patient-transfer robots, VLA models, and embodied AI.">

  <!-- Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ── HEADER ─────────────────────────────────────────────── -->
  <header id="site-header">
    <div class="header-inner">
      <h1 class="header-title">David <span>Lai</span></h1>
      <p class="header-subtitle">Robotics Research Engineer &amp; PhD Student</p>
      <div class="header-badges">
        <span class="badge">🤖 Patient Transfer Robots</span>
        <span class="badge">🧠 Embodied AI</span>
        <span class="badge">👁️ VLA Models</span>
        <span class="badge">🦾 ROS2 / MoveIt2</span>
      </div>
    </div>
  </header>

  <!-- ── STICKY NAV ─────────────────────────────────────────── -->
  <nav id="site-nav" aria-label="Portfolio sections">
    <!-- Tabs are injected by app.js from SECTIONS in config.js -->
    <div class="nav-inner" id="nav-tabs" role="tablist"></div>
  </nav>

  <!-- ── MAIN CONTENT MOUNT ─────────────────────────────────── -->
  <main id="content-mount" aria-live="polite">
    <!-- Section HTML is fetched and injected here by app.js -->
  </main>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer id="site-footer">
    <p>Built with ❤️ by David Lai &middot; <a href="https://github.com/davidlai" target="_blank">GitHub</a></p>
  </footer>

  <!-- Section registry & router (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
